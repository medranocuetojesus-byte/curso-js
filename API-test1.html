<body>
  <script>
    async function obtnerDatos() {
      const API_URL = 'https://api.restcountries.com/countries/v5/names.common/Canada'

      try {
        const respuesta = await fetch(API_URL, {
          headers: { 'Authorization': 'Bearer rc_live_a22664643c7e4dde9b1bfef230fb6a79' }
        })

        if (!respuesta.ok){
          throw new Error(`No es posible conectarse al servidor`)
        }

        const datos = await respuesta.json()
        console.log(datos)

      } catch (e) {
        console.error(`No se pudo concretar la operación: ${e}`);
      }


    }
  </script>
